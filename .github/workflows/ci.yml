name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  KNR_HEADLESS: "1"
  RUST_BACKTRACE: "1"

jobs:
  test-and-lint:
    name: Test & Clippy (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy (Workspace & All Targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Clippy (no-default-features & gpu)
        run: |
          cargo clippy -p knr-runtime -p knr-cli --no-default-features --all-targets -- -D warnings
          cargo clippy -p knr-runtime -p knr-cli --features gpu --all-targets -- -D warnings

      - name: Build Rust Runtime Staticlib
        run: cargo build -p knr-runtime --lib

      - name: Build knr CLI Binary
        run: cargo build -p knr-cli --bin knr

      - name: Run Workspace Tests
        run: cargo test --workspace -- --test-threads=4

      - name: Verify Showcase Site, Flagship Examples, Tests & Headless Audit
        run: |
          ./target/debug/knr check site/app.tsk
          ./target/debug/knr test site/app.tsk
          ./target/debug/knr render site/app.tsk -o /tmp/ci_site.png --width 1280 --height 1450 --scale 1.5 --assert-audit
          ./target/debug/knr check examples/neural_studio/src/app.tsk
          ./target/debug/knr test examples/neural_studio/src/app.tsk
          ./target/debug/knr render examples/neural_studio/src/app.tsk --flow examples/neural_studio/flow.json -o /tmp/ci_neural_studio.png --assert-audit
          ./target/debug/knr check examples/task_studio.tsk
          ./target/debug/knr test examples/task_studio.tsk
          ./target/debug/knr check examples/http_server.tsk
          ./target/debug/knr check examples/counter_app.tsk
          ./target/debug/knr test examples/counter_app.tsk
          ./target/debug/knr check examples/shader_studio.tsk
          ./target/debug/knr test examples/shader_studio.tsk
          ./target/debug/knr check examples/raymarch_3d.tsk
          ./target/debug/knr test examples/raymarch_3d.tsk
          ./target/debug/knr check examples/sys_demo.tsk
          ./target/debug/knr test examples/sys_demo.tsk
