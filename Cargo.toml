[workspace]
resolver = "2"
members = [
    "crates/knr-core",
    "crates/knr-verify",
    "crates/knr-interp",
    "crates/knr-runtime",
    "crates/knr-codegen",
    "crates/knr-cli",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
cranelift = "0.112"
cranelift-module = "0.112"
cranelift-object = "0.112"
wasm-encoder = "0.217"
tokio = { version = "1.40", features = ["full"] }
proptest = "1.5"

# Keep debug builds lean AND responsive (fast VM + CPU renderer, tiny target/ without DWARF bloat)
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Optimize pure-Rust CPU rasterizers even in dev builds so CPU fallback stays 60fps-smooth
[profile.dev.package.tiny-skia]
opt-level = 3
debug = false

[profile.dev.package.ab_glyph]
opt-level = 3
debug = false

[profile.dev.package.ab_glyph_rasterizer]
opt-level = 3
debug = false

[profile.dev.package.image]
opt-level = 3
debug = false
