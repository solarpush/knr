[package]
name = "knr-codegen"
version = "0.4.0"
edition = "2021"

[dependencies]
knr-core = { path = "../knr-core" }
knr-runtime = { path = "../knr-runtime" }
cranelift = { workspace = true }
cranelift-module = { workspace = true }
cranelift-object = { workspace = true }
cranelift-jit = "0.112"
cranelift-native = "0.112"
wasm-encoder = { workspace = true }
naga = { version = "23.1.0", features = ["wgsl-in", "glsl-out"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
knr-interp = { path = "../knr-interp" }
knr-verify = { path = "../knr-verify" }
proptest = { workspace = true }

[[test]]
name = "proptest_vm_codegen"
path = "../../tests/differential/proptest_vm_codegen.rs"
